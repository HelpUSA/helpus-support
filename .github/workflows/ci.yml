name: CI Pull Request Suite

on:
  pull_request:
    branches: [ main, feature/* ]
  push:
    branches: [ main, feature/* ]

jobs:
  test-and-build:
    name: Test & Build (Non-destructive)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suites (Watcher & Store)
        run: npm test
        env:
          EVENT_HMAC_SECRET: 'ci_event_hmac_secret_32_bytes_test_key_0123456789abcdef'
          SESSION_SECRET: 'ci_session_secret_32_bytes_test_key_0123456789abcdef'

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          EVENT_HMAC_SECRET: 'ci_event_hmac_secret_32_bytes_test_key_0123456789abcdef'
          SESSION_SECRET: 'ci_session_secret_32_bytes_test_key_0123456789abcdef'
