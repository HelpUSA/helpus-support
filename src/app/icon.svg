<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="helpusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rounded Base Badge -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#helpusGrad)" filter="url(#shadow)" />
  
  <!-- LifeBuoy Outer Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  
  <!-- LifeBuoy Inner Ring -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="#ffffff" stroke-width="24"/>
  
  <!-- LifeBuoy Straps -->
  <line x1="256" y1="80" x2="256" y2="152" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="256" y1="360" x2="256" y2="432" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="80" y1="256" x2="152" y2="256" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="360" y1="256" x2="432" y2="256" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
</svg>
