name: Antigravity Automated Watchdog Pipeline

on:
  repository_dispatch:
    types: [ticket_approved]
  workflow_dispatch:

jobs:
  execute-pipeline:
    name: Execute Ticket Production Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Antigravity Watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/antigravity_watcher.js
